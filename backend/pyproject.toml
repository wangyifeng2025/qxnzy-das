[project]
name = "qxnzy-das-backend"
version = "0.1.0"
description = "黔西南职院数据采集系统后端"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "arq>=0.26,<1",
    "asyncpg>=0.30,<1",
    "email-validator>=2.2,<3",
    "fastapi-users[sqlalchemy]>=14,<16",
    "fastapi[standard]>=0.115,<1",
    "httpx>=0.28,<1",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "pdfplumber>=0.11,<1",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.7,<3",
    "pyjwt>=2.9,<3",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "xlrd>=2.0,<3",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "mypy>=1.15,<2",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
